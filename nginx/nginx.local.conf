client_max_body_size 10G;

upstream backend {
    server backend:8000;
}

upstream onlyoffice_upstream {
    server onlyoffice:80;
}

upstream collabora_upstream {
    server collabora:9980;
}

# Local development server block (HTTP)
server {
    listen 80;
    server_name localhost;

    # ── OnlyOffice ────────────────────────────────────────────────────────────
    location ~* ^/(web-apps|cache|coauthoring|converter|healthcheck) {
        proxy_pass         http://onlyoffice_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host             $http_host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Collabora / LibreOffice Online ────────────────────────────────────────
    location ^~ /hosting/ {
        proxy_pass http://collabora_upstream;
        proxy_set_header Host             $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location ^~ /browser/ {
        proxy_pass http://collabora_upstream;
        proxy_set_header Host             $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Collabora WebSocket connections (document editing channel).
    location ^~ /coolws/ {
        proxy_pass         http://collabora_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host             $http_host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    location ^~ /cool/ {
        proxy_pass         http://collabora_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host             $http_host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ── Redirect old /ui/* URLs to new root structure ──────────────────────
    location ^~ /ui/ {
        rewrite ^/ui/(.*)$ /$1 last;
    }

    # ── React SPA (served from /) ────────────────────────────────────────────
    # All requests to / are served from the built frontend/dist volume.
    location = /index.html {
        root /var/www/ui;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(js|mjs|css|json|woff|woff2|ttf|otf)$ {
        root /var/www/ui;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── WebDAV (MS Word desktop open/save) ───────────────────────────────────
    location ^~ /webdav/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host             $http_host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }

    # ── WOPI (LibreOffice Online callbacks) ───────────────────────────────────
    location ^~ /wopi/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host             $http_host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
    }

    # ── API ───────────────────────────────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host             $http_host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
        proxy_cookie_path   /  /;
        proxy_cookie_flags  ~ httponly samesite=lax;
    }

    # ── React SPA catch-all ───────────────────────────────────────────────────
    location / {
        root /var/www/ui;
        try_files $uri /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
