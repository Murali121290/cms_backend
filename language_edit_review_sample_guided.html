<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Language Review — Guided Flow (Sample 3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], serif: ['Source Serif 4','Georgia','serif'] } } } }
</script>
<style>
  body { background: radial-gradient(1200px 600px at 50% -10%, #ede9fe 0%, #f8fafc 55%, #f8fafc 100%); }
  .card { animation: pop .28s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .strip-dot { transition: all .15s ease; }
  .strip-dot.current { transform: scale(1.35); }
  .kbd { font-family: 'Inter', sans-serif; border: 1px solid #e2e8f0; border-bottom-width:2px; border-radius:6px; padding:1px 6px; font-size:11px; color:#64748b; background:#fff; }
</style>
</head>
<body class="min-h-screen text-slate-800 font-sans antialiased flex flex-col">

  <!-- TOP PROGRESS -->
  <header class="px-6 pt-5 flex-shrink-0">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <button class="p-1.5 rounded-full text-slate-400 hover:text-slate-700 hover:bg-white/70 transition-colors">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
          </button>
          <span class="text-xs text-slate-500">manuscript_ch04.docx</span>
        </div>
        <span id="stepLabel" class="text-xs font-semibold text-violet-600">Issue 3 of 24</span>
      </div>
      <div class="h-2 rounded-full bg-white/70 overflow-hidden">
        <div id="progressBar" class="h-full bg-gradient-to-r from-violet-500 to-fuchsia-500 rounded-full transition-all duration-300" style="width: 8%"></div>
      </div>

      <!-- category mini counts -->
      <div class="flex items-center gap-4 mt-3 text-[11px] text-slate-500">
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-500"></span>Grammar <b class="text-slate-700">6</b></span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-sky-500"></span>Spelling <b class="text-slate-700">5</b></span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-purple-500"></span>Sentence <b class="text-slate-700">4</b></span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>Compounds <b class="text-slate-700">4</b></span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-rose-500"></span>Inclusive <b class="text-slate-700">5</b></span>
        <span id="resolvedNote" class="ml-auto font-medium text-emerald-600">🎉 14 resolved so far</span>
      </div>
    </div>
  </header>

  <!-- CENTER CARD -->
  <main class="flex-1 flex items-center justify-center px-6 py-6">
    <div class="max-w-xl w-full">
      <div id="issueCard" class="card bg-white rounded-3xl shadow-xl shadow-violet-100 border border-slate-100 p-8">
        <!-- filled by JS -->
      </div>

      <!-- mini strip navigator -->
      <div class="mt-6 flex items-center justify-center gap-2" id="strip"></div>

      <p class="text-center text-xs text-slate-400 mt-4">Sample content for design review only — not connected to live data.</p>
    </div>
  </main>

  <script>
    const CATS = {
      grammar:  { color: '#f59e0b', bg: '#fef3c7', text: '#b45309', label: 'Grammar' },
      spelling: { color: '#0ea5e9', bg: '#e0f2fe', text: '#0369a1', label: 'Spelling' },
      sentence: { color: '#a855f7', bg: '#f3e8ff', text: '#7e22ce', label: 'Sentence' },
      compounds:{ color: '#10b981', bg: '#d1fae5', text: '#047857', label: 'Compounds' },
      bias:     { color: '#f43f5e', bg: '#ffe4e6', text: '#be123c', label: 'Inclusive language' },
    };

    const findings = [
      { cat:'bias', severity:'Medium', context:'Clinicians should be aware that the drug interacts with <b>he</b> patient\'s existing medication regimen.', message:'Use gender-neutral phrasing instead of "he" when referring to any patient.', before:'he', after:'the patient', resolved:true },
      { cat:'grammar', severity:'Low', context:'Dosing should be adjusted <b>wich</b> accordingly to the patient\'s response.', message:'"Wich" looks like a typo for "which."', before:'wich', after:'which', resolved:true },
      { cat:'spelling', severity:'Low', context:'Researchers found that <b>seperate</b> dosing schedules reduced adverse events by nearly a third.', message:'Did you mean "separate"? This word is commonly misspelled.', before:'seperate', after:'separate', resolved:false },
      { cat:'sentence', severity:'Medium', context:'…during which <b>the patients who had been enrolled in the study and who had also completed the prior screening phase were monitored continuously</b> for signs of gastrointestinal distress.', message:'This sentence is 38 words long — readability improves if it\'s split into two shorter sentences.', before:'the patients who had been enrolled in the study and who had also completed the prior screening phase were monitored continuously', after:'Patients enrolled in the study who had completed the prior screening phase were monitored continuously.', resolved:false },
      { cat:'compounds', severity:'Low', context:'A <b>follow up</b> visit is recommended within 48 hours of the initial dose.', message:'Hyphenate "follow-up" when it modifies the noun "visit."', before:'follow up', after:'follow-up', resolved:false },
    ];

    let idx = 2; // start on issue #3 to match header ("Issue 3 of 24")
    const total = 24;
    let resolvedCount = 14;

    function render() {
      const f = findings[idx];
      const c = CATS[f.cat];
      document.getElementById('stepLabel').textContent = `Issue ${idx+1} of ${findings.length}`;
      document.getElementById('progressBar').style.width = Math.round(((idx+1)/findings.length)*100) + '%';
      document.getElementById('resolvedNote').textContent = `🎉 ${resolvedCount} resolved so far`;

      document.getElementById('issueCard').innerHTML = `
        <div class="flex items-center justify-between mb-5">
          <span class="px-3 py-1 rounded-full text-xs font-bold" style="background:${c.bg}; color:${c.text}">${c.label}</span>
          <span class="text-xs text-slate-400">${f.severity} severity</span>
        </div>
        <p class="font-serif text-lg leading-8 text-slate-700">${f.context}</p>
        <p class="text-sm text-slate-500 mt-4">${f.message}</p>

        <div class="mt-6 space-y-2">
          <div class="flex items-center gap-3 p-3 rounded-xl bg-rose-50 border border-rose-100">
            <span class="text-rose-500 font-bold text-sm">✕</span>
            <span class="font-mono text-sm text-rose-700 line-through">${f.before}</span>
          </div>
          <div class="flex items-center gap-3 p-3 rounded-xl bg-emerald-50 border border-emerald-100">
            <span class="text-emerald-600 font-bold text-sm">✓</span>
            <span id="afterText" class="font-mono text-sm text-emerald-700">${f.after}</span>
          </div>
        </div>

        <div id="editRow" class="mt-3 hidden">
          <input type="text" id="editInput" value="${f.after}" class="w-full text-sm border border-violet-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-violet-200" />
        </div>

        <div class="mt-6 grid grid-cols-3 gap-2">
          <button onclick="decide('rejected')" class="py-2.5 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-sm font-semibold transition-colors">Reject</button>
          <button onclick="toggleEdit()" class="py-2.5 rounded-xl border border-amber-200 text-amber-600 hover:bg-amber-50 text-sm font-semibold transition-colors">Edit</button>
          <button onclick="decide('accepted')" class="py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shadow-md shadow-emerald-200 transition-colors">Accept</button>
        </div>
        <div class="flex items-center justify-center gap-4 mt-3 text-[11px] text-slate-400">
          <span><span class="kbd">R</span> reject</span>
          <span><span class="kbd">E</span> edit</span>
          <span><span class="kbd">A</span> accept</span>
          <button onclick="next()" class="text-slate-400 hover:text-slate-600 underline">skip for now</button>
        </div>
      `;
      renderStrip();
    }

    function renderStrip() {
      const strip = document.getElementById('strip');
      strip.innerHTML = '';
      findings.forEach((f, i) => {
        const c = CATS[f.cat];
        const dot = document.createElement('button');
        dot.className = 'strip-dot w-2.5 h-2.5 rounded-full' + (i === idx ? ' current' : '');
        dot.style.background = f.resolved ? '#cbd5e1' : c.color;
        dot.title = `${c.label} — ${f.resolved ? 'resolved' : 'pending'}`;
        dot.onclick = () => { idx = i; render(); };
        strip.appendChild(dot);
      });
    }

    function toggleEdit() {
      document.getElementById('editRow').classList.toggle('hidden');
    }

    function decide(status) {
      findings[idx].resolved = true;
      if (status === 'accepted') resolvedCount++;
      next();
    }

    function next() {
      if (idx < findings.length - 1) { idx++; render(); }
      else {
        document.getElementById('issueCard').innerHTML = `
          <div class="text-center py-8">
            <div class="text-4xl mb-3">🎉</div>
            <h2 class="text-lg font-bold text-slate-800">All caught up!</h2>
            <p class="text-sm text-slate-500 mt-1">You've reviewed every suggestion in this sample. Nice work.</p>
          </div>`;
      }
    }

    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'a') decide('accepted');
      if (k === 'r') decide('rejected');
      if (k === 'e') toggleEdit();
    });

    render();
  </script>
</body>
</html>
